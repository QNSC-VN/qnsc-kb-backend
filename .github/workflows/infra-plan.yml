# =============================================================================
# Infrastructure · Plan — thin caller of the shared reusable (qnsc-ci).
#
# Dry-run on every PR touching infra: posts a plan comment per changed workspace and
# gates on `tofu fmt`.
# =============================================================================
name: Infrastructure · Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/live/**"
      # modules/** matters too: `module "stack"` is a LOCAL path module, so editing it
      # changes the plan for both environments. Without this a module-only PR merges
      # with no plan reviewed at all, and infra-apply (same filter) then applies it
      # unseen.
      - "infra/modules/**"
      - ".github/workflows/infra-plan.yml"

# Granted at the caller because a reusable workflow can never exceed the caller's token.
# id-token:write is mandatory for the OIDC AssumeRole; without an explicit grant it
# defaults to none and GitHub rejects the whole workflow at compile time ("0 jobs").
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    uses: QNSC-VN/qnsc-ci/.github/workflows/infra-plan.yml@v1.7.0
    with:
      product: qnsc-kb
      # No non-secret TF_VARs are passed: every public identifier this stack needs
      # (tunnel id, Cloudflare account id, OAuth client ids) lives in
      # infra/live/*/variables.tf precisely so plan and apply see the same values.
      #
      # A plan job has no `environment:` context — adding one would gate every PR behind
      # the production reviewer — so an environment-scoped Actions variable resolves to
      # "" here. Values that reach apply but not plan make the plan lie: count-gated
      # resources show as phantom creates or destroys, and a real destroy is easy to miss
      # among them.
    secrets:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      # Secret half of the apply-time TF_VARs (masked inside the reusable).
      tf_secret_vars_json: |
        {
          "cloudflare_api_token": "${{ secrets.CLOUDFLARE_API_TOKEN }}"
        }
