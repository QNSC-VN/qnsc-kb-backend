# =============================================================================
# Release commenter — comments on and labels every PR included in a release, so a
# reviewer can tell from the PR itself whether the change is live.
# =============================================================================
name: Release Commenter

on:
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment:
    uses: QNSC-VN/qnsc-ci/.github/workflows/release-commenter.yml@v1.7.0
