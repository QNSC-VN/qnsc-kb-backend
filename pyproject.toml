[tool.poetry]
name = "qnsc-kb-backend"
version = "0.1.0"
description = "Knowledge Base Backend API for QNSC"
authors = ["QNSC-VN"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
pydantic = {extras = ["email"], version = "^2.7.4"}
pydantic-settings = "^2.3.4"
sqlalchemy = "^2.0.31"
alembic = "^1.13.1"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
pgvector = "^0.3.1"
celery = "^5.4.0"
redis = "^5.0.6"
boto3 = "^1.35.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
httpx = "^0.27.0"
structlog = "^24.2.0"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp-proto-http = "^1.27.0"
sentence-transformers = "^3.0.1"
bcrypt = "3.2.2"
torch = { version = "2.6.0", source = "pytorch-cpu" }
numpy = "<2.0.0"
paddlepaddle = "^3.0.0"
paddleocr = "^3.0.0"
pypdf = "^5.4.0"
python-docx = "^1.1.2"
openpyxl = "^3.1.5"
python-pptx = "^1.0.2"
pillow = "^11.1.0"
pymupdf = "^1.25.3"
# 0.0.2 is the last MarkItDown release compatible with this project's
# NumPy 1.x constraint (required by the local Paddle/Torch OCR stack).
markitdown = "0.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
black = ">=24.4.2,<27.0.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
